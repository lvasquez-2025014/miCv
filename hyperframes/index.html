<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Silhouette — HyperFrames</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 3840px;
      height: 2160px;
      overflow: hidden;
      background: #0a0e12;
    }
    #root {
      position: relative;
      width: 3840px;
      height: 2160px;
      overflow: hidden;
      background: #0a0e12;
    }
  </style>
</head>
<body>
  <div id="root"
       data-composition-id="main"
       data-start="0"
       data-duration="8"
       data-width="3840"
       data-height="2160">
    <div id="hero-scene"
         data-composition-id="hero-scene"
         data-composition-src="compositions/hero-scene.html"
         data-start="0"
         data-duration="8"
         data-track-index="1"
         data-track-kind="graphics"
         data-width="3840"
         data-height="2160"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
